name: Wine catalog audit

on:
  push:
    branches:
      - restart/sommelier-v2-foundation
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit legacy catalog
        run: python scripts/catalog_audit.py
      - name: Run v2 tests
        run: python -m unittest discover -s tests -v
