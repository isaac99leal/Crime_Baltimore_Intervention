name: Sommelier Web CI

on:
  push:
    paths:
      - 'sommelier-web/**'
      - '.github/workflows/sommelier-web.yml'
  pull_request:
    paths:
      - 'sommelier-web/**'
      - '.github/workflows/sommelier-web.yml'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sommelier-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sommelier-web/package-lock.json
      - run: npm install
      - run: npm test
      - run: npm run build
